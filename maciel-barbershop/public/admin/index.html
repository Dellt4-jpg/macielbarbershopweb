<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel | Maciel Barbershop</title>
  <meta name="theme-color" content="#0b0b0d">
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <style>
/* Base compartida: variables, reset, botones, formularios, toasts, diálogos */
:root {
  --bg: #0b0b0d;
  --surface: #151518;
  --surface-2: #1c1c21;
  --line: #2a2a31;
  --text: #f5f5f6;
  --muted: #9a9aa3;
  --metal: #b8bcc4;
  --metal-2: #8d929c;
  --ok: #4ade80;
  --warn: #fbbf24;
  --danger: #f87171;
  --radius: 14px;
  --font-head: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --ease: cubic-bezier(.22, .7, .2, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
img, svg { max-width: 100%; display: block; }
a { color: inherit; }
h1, h2, h3 { font-family: var(--font-head); text-transform: uppercase; letter-spacing: .04em; line-height: 1.05; margin: 0 0 .5em; }
p { margin: 0 0 1em; }
:focus-visible { outline: 2px solid var(--metal); outline-offset: 3px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Botones */
.btn {
  --btn-bg: var(--surface-2); --btn-fg: var(--text); --btn-bd: var(--line);
  display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
  min-height: 48px; padding: .75rem 1.5rem; border-radius: 10px;
  border: 1px solid var(--btn-bd); background: var(--btn-bg); color: var(--btn-fg);
  font: 600 .95rem var(--font-body); letter-spacing: .08em; text-transform: uppercase; text-decoration: none;
  cursor: pointer; transition: transform .25s var(--ease), background .25s, border-color .25s, box-shadow .25s;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover { transform: translateY(-2px); border-color: var(--metal-2); }
.btn:active { transform: translateY(0); }
.btn--primary { --btn-bg: linear-gradient(135deg, #f1f2f4, #aeb2ba); --btn-fg: #0b0b0d; --btn-bd: transparent; }
.btn--primary:hover { box-shadow: 0 10px 30px rgba(184,188,196,.25); border-color: transparent; }
.btn--ghost { --btn-bg: transparent; --btn-bd: var(--metal-2); }
.btn--ghost:hover { background: rgba(255,255,255,.06); }
.btn--danger { --btn-fg: var(--danger); --btn-bd: rgba(248,113,113,.4); }
.btn--ok { --btn-fg: #0b0b0d; --btn-bg: var(--ok); --btn-bd: transparent; }
.btn--sm { min-height: 40px; padding: .45rem 1rem; font-size: .8rem; }
.btn--block { width: 100%; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.btn .spinner { width: 18px; height: 18px; }

.spinner {
  display: inline-block; width: 28px; height: 28px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,.2); border-top-color: var(--metal);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Formularios */
.field { display: grid; gap: .4rem; margin-bottom: 1rem; }
.field label { font-size: .85rem; color: var(--metal); letter-spacing: .04em; }
.field .hint { font-size: .78rem; color: var(--muted); }
.field .error { font-size: .82rem; color: var(--danger); min-height: 1em; }
input[type=text], input[type=tel], input[type=email], input[type=password], input[type=number],
input[type=date], input[type=time], input[type=url], select, textarea {
  width: 100%; min-height: 50px; padding: .75rem 1rem; border-radius: 10px;
  background: var(--surface-2); color: var(--text); border: 1px solid var(--line);
  font: inherit; font-size: 16px; /* 16px evita el zoom en iOS */
  transition: border-color .2s, box-shadow .2s;
}
textarea { min-height: 110px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--metal); box-shadow: 0 0 0 3px rgba(184,188,196,.15); }
input[aria-invalid="true"] { border-color: var(--danger); }
.check { display: flex; align-items: center; gap: .6rem; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--metal); }

/* Toasts */
#toasts { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 1000; display: grid; gap: .5rem; width: min(92vw, 420px); pointer-events: none; }
.toast {
  padding: .85rem 1.1rem; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line);
  box-shadow: 0 10px 40px rgba(0,0,0,.5); animation: toast-in .35s var(--ease); pointer-events: auto; font-size: .95rem;
}
.toast--ok { border-color: rgba(74,222,128,.5); }
.toast--error { border-color: rgba(248,113,113,.6); }
@keyframes toast-in { from { opacity: 0; transform: translateY(12px); } }

/* Diálogo */
dialog {
  width: min(94vw, 560px); max-height: 92vh; padding: 0; border: 1px solid var(--line);
  border-radius: 18px; background: var(--surface); color: var(--text); overflow: auto;
}
dialog::backdrop { background: rgba(0,0,0,.75); backdrop-filter: blur(4px); }
dialog[open] { animation: dialog-in .3s var(--ease); }
@keyframes dialog-in { from { opacity: 0; transform: translateY(16px) scale(.98); } }
.dialog__body { padding: 1.5rem; }
.dialog__head { display: flex; justify-content: space-between; align-items: start; gap: 1rem; }
.dialog__close { background: none; border: 0; color: var(--muted); font-size: 1.8rem; line-height: 1; cursor: pointer; padding: .2rem .5rem; }

/* Badges de estado */
.badge { display: inline-block; padding: .25rem .65rem; border-radius: 999px; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; border: 1px solid var(--line); color: var(--metal); white-space: nowrap; }
.badge--pendiente_pago, .badge--pendiente_confirmacion { color: var(--warn); border-color: rgba(251,191,36,.4); }
.badge--confirmada, .badge--entregada { color: var(--ok); border-color: rgba(74,222,128,.4); }
.badge--cancelada { color: var(--danger); border-color: rgba(248,113,113,.4); }
.badge--finalizada { color: var(--metal-2); }

.empty { text-align: center; padding: 2.5rem 1rem; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }
.empty strong { display: block; color: var(--text); font-family: var(--font-head); font-size: 1.4rem; text-transform: uppercase; letter-spacing: .05em; margin-bottom: .3rem; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* Panel administrativo — mobile-first */
.center-pad { display: grid; place-items: center; padding: 3rem; }
.login { min-height: 100svh; display: grid; place-items: center; padding: 1.25rem; }
.login__card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 2rem 1.5rem; }
.login__card img { width: 80px; margin: 0 auto 1rem; }
.login__card h1 { text-align: center; font-size: 2rem; }
.login__card .error-box { color: var(--danger); font-size: .9rem; margin-bottom: 1rem; min-height: 1.2em; }

.shell { display: grid; min-height: 100svh; grid-template-rows: auto 1fr; }
.topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .6rem 1rem; background: rgba(11,11,13,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar__brand { display: flex; align-items: center; gap: .6rem; font-family: var(--font-head); letter-spacing: .1em; text-transform: uppercase; font-size: 1.15rem; }
.topbar__brand img { width: 32px; height: 32px; }
.tabs { display: flex; gap: .4rem; overflow-x: auto; padding: .6rem 1rem; border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 57px; z-index: 40; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { flex: 0 0 auto; text-decoration: none; padding: .55rem 1rem; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: .85rem; white-space: nowrap; }
.tabs a.is-active { background: var(--text); color: #0b0b0d; border-color: var(--text); font-weight: 600; }
.view { padding: 1.25rem 1rem 4rem; width: min(1000px, 100%); margin-inline: auto; }
.view h2 { font-size: 2rem; }
.view__head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
.view__head h2 { margin: 0; }

.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem; margin-bottom: 1.5rem; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1rem; }
.stat small { display: block; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; }
.stat strong { font-family: var(--font-head); font-size: 2.2rem; line-height: 1.1; }
.stat--alert strong { color: var(--warn); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 1.1rem; margin-bottom: 1rem; }
.panel h3 { font-size: 1.3rem; }
.list { display: grid; gap: .7rem; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1rem; display: grid; gap: .6rem; }
.item__top { display: flex; justify-content: space-between; align-items: start; gap: .6rem; flex-wrap: wrap; }
.item__title { font-weight: 600; }
.item__meta { color: var(--muted); font-size: .88rem; display: grid; gap: .15rem; }
.item__actions { display: flex; gap: .5rem; flex-wrap: wrap; }
.item--off { opacity: .55; }
.item__img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: var(--surface-2); }
.item__row { display: flex; gap: .9rem; align-items: center; }

.filters { display: grid; gap: .6rem; grid-template-columns: 1fr 1fr; margin-bottom: 1rem; }
.filters .field { margin: 0; }
.day-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1rem; margin-bottom: .8rem; }
.day-card__head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: .6rem; }
.day-card__head strong { font-family: var(--font-head); font-size: 1.4rem; letter-spacing: .06em; text-transform: uppercase; }
.range { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: .5rem; align-items: center; margin-bottom: .5rem; }
.range span { color: var(--muted); }
.range button { width: 44px; height: 44px; }
.form-grid { display: grid; gap: 0 1rem; }
.section-title { margin: 1.4rem 0 .6rem; color: var(--metal); font-size: .8rem; text-transform: uppercase; letter-spacing: .15em; }
.preview-img { max-width: 120px; border-radius: 10px; margin-bottom: .5rem; background: var(--surface-2); }

@media (min-width: 720px) {
  .stats { grid-template-columns: repeat(4, 1fr); }
  .filters { grid-template-columns: 220px 220px; }
  .form-grid { grid-template-columns: 1fr 1fr; }
  .form-grid .field--wide { grid-column: 1 / -1; }
  .tabs { top: 57px; padding-inline: 1.5rem; }
}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" defer></script>
  <script type="module" src="admin.js"></script>
</head>
<body>
  <div id="app"><div class="center-pad"><span class="spinner"></span></div></div>
  <dialog id="modal"></dialog>
</body>
</html>
